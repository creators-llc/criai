<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="https://storage.googleapis.com/creators-static-1/images/Favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRIA AÍ - Influência em Escala Real e Comunidades de Alta Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@1,400;1,600;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
<style>
:root{
  --pink:#F564FF; --lav:#ECD9FF; --peach:#FBA0A4; --violet:#622DFF;
  --grad:linear-gradient(135deg,#FBA0A4 0%,#BD3DF6 30%,#F8C18D 66%,#7796FE 100%);
  --sans:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Crimson Pro",Georgia,"Times New Roman",serif;
  --panel:#15101d; --panel2:#1f1829; --line:rgba(255,255,255,.14); --text:#f4eefa; --muted:#a898bd;
}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{font-family:var(--sans);color:#fff;cursor:default}
body.idle{cursor:none}

/* ---------- 16:9 stage, scaled to fit ---------- */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;transition:opacity 1.2s ease}
.bg-a{background:
  radial-gradient(60% 70% at -4% -6%, rgba(70,25,140,.95) 0%, rgba(70,25,140,0) 70%),
  radial-gradient(30% 32% at 10% 18%, rgba(98,45,255,.35) 0%, rgba(98,45,255,0) 70%),
  radial-gradient(60% 65% at 104% 106%, rgba(70,25,140,.95) 0%, rgba(70,25,140,0) 70%),
  radial-gradient(26% 30% at 90% 88%, rgba(190,60,246,.3) 0%, rgba(190,60,246,0) 70%), #000}
.bg-b{background:
  radial-gradient(60% 70% at 104% -6%, rgba(70,25,140,.95) 0%, rgba(70,25,140,0) 70%),
  radial-gradient(30% 32% at 90% 18%, rgba(98,45,255,.35) 0%, rgba(98,45,255,0) 70%),
  radial-gradient(60% 65% at -4% 106%, rgba(70,25,140,.95) 0%, rgba(70,25,140,0) 70%),
  radial-gradient(26% 30% at 10% 88%, rgba(190,60,246,.28) 0%, rgba(190,60,246,0) 70%), #000}
.bg-c{background:
  radial-gradient(90% 70% at 50% 118%, rgba(70,25,140,.95) 0%, rgba(70,25,140,0) 70%),
  radial-gradient(45% 30% at 50% 100%, rgba(190,60,246,.3) 0%, rgba(190,60,246,0) 70%),
  radial-gradient(40% 45% at -6% -8%, rgba(70,25,140,.8) 0%, rgba(70,25,140,0) 70%), #000}

/* top pill */
.pill{position:absolute;left:96px;top:44px;width:1728px;height:76px;border-radius:38px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 30px;z-index:5;transition:opacity .8s ease}
.pill .c{width:52px;height:52px}
.pill .right{display:flex;align-items:center;gap:22px;font-weight:600;font-size:27px;letter-spacing:.02em}
.pill .burger{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#8a8a8a,#2a2a2a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.pill .burger i{display:block;width:22px;height:3.5px;border-radius:2px;background:#fff}
#stage.breaking .pill{opacity:0}

/* scenes */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.scene.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.scene .in{opacity:0;transform:translateY(24px)}
.scene.on .in{animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d,0) * 1ms + 250ms)}
@keyframes rise{to{opacity:1;transform:none}}
.layer{position:absolute;inset:0}
.spark{position:absolute;width:30px;height:30px;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.55}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
.burst{position:absolute;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* intro scene */
#intro .eyebrow{position:absolute;left:120px;top:258px;width:780px;text-align:center;color:var(--pink);font-weight:600;font-size:30px;letter-spacing:.06em}
#intro .eyebrow b{font-weight:800}
#intro .logo{position:absolute;left:108px;top:318px;width:780px}
#intro .rule{position:absolute;left:150px;top:560px;width:690px;height:2px;background:var(--peach)}
#intro .tag{position:absolute;left:120px;top:580px;width:760px;text-align:center;font-family:var(--serif);font-style:italic;font-size:74px;color:var(--lav)}
.brand{position:absolute;left:120px;top:896px}
.brand svg{width:270px;display:block}
.brand p{margin:12px 0 0;font-size:28px}
.brand p em{font-family:var(--serif);color:var(--lav)}
.steps{position:absolute;left:1040px;top:166px;width:784px;display:flex;flex-direction:column;gap:22px}
.step{position:relative;min-height:176px;border-radius:28px;padding:28px 40px 30px 128px;background:rgba(14,10,20,.82);display:flex;flex-direction:column;justify-content:center}
.step::before,.frame::before,.chip::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2.5px;background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.step .badge{position:absolute;left:26px;top:50%;margin-top:-40px;width:80px;height:80px}
.step h3{margin:0;font-family:var(--serif);font-style:italic;font-weight:700;font-size:46px;line-height:1.05;color:var(--pink)}
.step p{margin:10px 0 0;font-size:25px;line-height:1.4;color:#f1ecf7}
.badge{display:grid;place-items:center}
.badge svg{position:absolute;inset:0;width:100%;height:100%}
.badge span{position:relative;font-weight:700;color:#2a0a3a;font-size:32px}

/* dynamic scene */
.dyn .eyebrow{position:absolute;left:96px;top:212px;color:var(--pink);font-weight:700;font-size:25px;letter-spacing:.12em}
.dyn h2{position:absolute;left:96px;top:250px;width:430px;margin:0;font-family:var(--serif);font-style:italic;font-weight:700;font-size:92px;line-height:.92}
.dyn .desc{position:absolute;left:96px;width:420px;margin:0;font-size:29px;line-height:1.35;color:var(--lav);font-weight:400}
.dyn .taglabel{position:absolute;left:96px;color:var(--pink);font-weight:700;font-size:24px;letter-spacing:.1em}
.tags{position:absolute;left:96px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.chip{position:relative;height:56px;padding:0 30px;border-radius:28px;background:rgba(245,100,255,.10);display:inline-flex;align-items:center;font-weight:700;font-size:25px;white-space:nowrap}
.mini{position:absolute;left:96px;top:914px}
.mini svg{width:230px;display:block}
.mini p{margin:10px 0 0;font-family:var(--serif);font-style:italic;font-size:38px;color:var(--lav)}
.frames{position:absolute;left:554px;top:200px;display:flex;gap:44px}
.slot{width:394px}
.frame{position:relative;width:394px;height:700px;border-radius:24px;background:#160f20;overflow:visible;transition:transform .6s ease,filter .6s ease}
.frame::before{inset:-10px;border-radius:32px;padding:3.5px}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:22px;background:#0c0812;transition:opacity .5s ease,filter .6s ease}
.slot.wait .frame video{filter:brightness(.42) saturate(.7)}
.slot.live .frame{transform:scale(1.03)}
.slot.live .frame::after{content:"";position:absolute;inset:-26px;border-radius:44px;background:radial-gradient(closest-side,rgba(245,100,255,.28),transparent);z-index:-1}
.slot.done .frame video{filter:brightness(.6) saturate(.8)}
.prog{position:absolute;left:0;right:0;bottom:-26px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .4s}
.slot.live .prog{opacity:1}
.prog i{display:block;height:100%;width:0;background:var(--grad)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px}
.empty strong{font-family:var(--serif);font-style:italic;font-size:46px;line-height:1.05;color:var(--lav)}
.empty span{font-size:28px;color:#b3a4cc}
.who{display:flex;align-items:center;justify-content:center;margin-top:40px;height:54px}
.who b{font-size:30px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* break (intervalo) scene */
#break{background:#000}
#break video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

/* prize scene */
#prize h2{position:absolute;left:150px;top:230px;margin:0;font-weight:700;font-size:82px;line-height:1}
#prize .value{position:absolute;left:140px;top:410px;font-family:var(--serif);font-style:italic;font-weight:700;font-size:250px;line-height:1;color:var(--pink)}
#prize .body{position:absolute;left:150px;top:700px;width:900px;margin:0;font-size:28px;line-height:1.45;color:var(--lav)}
#prize .cta{position:absolute;left:1330px;top:500px;width:520px;height:130px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-style:italic;font-weight:700;font-size:52px;line-height:1.1}
#prize .brand{left:150px}

/* status + controls (fora do stage, px reais) */
#hud{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:20;transition:opacity .4s}
body.idle #hud{opacity:0;pointer-events:none}
.btn{font:600 15px var(--sans);color:#fff;background:rgba(20,14,30,.85);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 18px;cursor:pointer}
.btn:hover{background:rgba(50,30,70,.95)}
.btn:focus-visible,.field:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.btn.primary{background:var(--pink);color:#1c0626;border-color:transparent}
#notice{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(20,14,30,.92);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px 18px;font-size:15px;z-index:30;max-width:90vw}

/* admin panel */
#admin{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--panel);color:var(--text);z-index:40;transform:translateX(105%);transition:transform .35s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#admin.open{transform:none}
#admin header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
#admin header h2{margin:0;font-family:var(--serif);font-style:italic;font-size:30px;color:var(--pink)}
#admin .scroll{overflow-y:auto;padding:20px 22px 40px;flex:1}
.card{background:var(--panel2);border-radius:16px;padding:18px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:600}
label.l{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.field,select{width:100%;font:400 16px var(--sans);color:var(--text);background:#0f0b16;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.drop{margin-top:12px;border:1.5px dashed rgba(245,100,255,.5);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:15px;cursor:pointer}
.drop.over{background:rgba(245,100,255,.08)}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:10px 0 0}
.queue{margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.queue .q{display:flex;justify-content:space-between;gap:10px;background:#0f0b16;border-radius:8px;padding:8px 10px}
.queue .ok{color:#8ef0b0}.queue .err{color:#ff9a9a}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{font:600 14px var(--sans);color:var(--muted);background:#0f0b16;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:#1c0626;background:var(--pink);border-color:transparent}
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:#0f0b16;border-radius:10px;padding:8px}
.vrow video{width:56px;height:100px;object-fit:cover;border-radius:6px;background:#000}
.vrow .meta input{width:100%;font:500 15px var(--sans);color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 6px}
.vrow .meta input:hover,.vrow .meta input:focus{border-color:var(--line)}
.vrow .meta small{display:block;color:var(--muted);font-size:12px;padding:2px 6px}
.vrow .acts{display:flex;flex-direction:column;gap:6px}
.vrow .acts button{font:600 12px var(--sans);color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.vrow.off{opacity:.5}
.empty-list{color:var(--muted);font-size:14px;padding:6px 2px}
.vrow .acts button.armed{background:#ff9a9a;color:#2a0606;border-color:transparent}
.vrow .acts button:disabled{opacity:.6}
@media (prefers-reduced-motion:reduce){.spark,.burst{animation:none}.scene.on .in{animation-duration:.01ms}}
</style>
</head>
<body>

<div id="app"></div>

<!-- ======================= TEMPLATE VUE ======================= -->
<script type="text/x-template" id="tpl-app">
<div>
  <div id="viewport">
    <div id="stage" :class="{ breaking: breaking }" :style="{ transform: 'scale(' + scale + ')' }">
      <div class="bg bg-a" :style="{ opacity: bg === 'a' ? 1 : 0 }"></div>
      <div class="bg bg-b" :style="{ opacity: bg === 'b' ? 1 : 0 }"></div>
      <div class="bg bg-c" :style="{ opacity: bg === 'c' ? 1 : 0 }"></div>

      <div class="pill" aria-hidden="true">
        <svg class="c" viewBox="0 0 72 72"><use href="#cIcon"/></svg>
        <div class="right">CRTRS.AI <span class="burger"><i></i><i></i></span></div>
      </div>

      <!-- INTRO -->
      <section class="scene" id="intro" :class="{ on: scene === 'intro' }" aria-label="Como participar">
        <svg class="burst" style="left:-360px;top:840px;width:560px;height:560px" viewBox="0 0 292 292"><use href="#burstOutline"/></svg>
        <div class="eyebrow in" style="--d:0">DESAFIO DE CONTEÚDO <b>AO VIVO</b></div>
        <svg class="logo in" style="--d:120" viewBox="0 0 407 108"><use href="#criaLogo"/></svg>
        <div class="rule in" style="--d:350"></div>
        <div class="tag in" style="--d:450">Crie, poste e ganhe.</div>
        <div class="steps">
          <div v-for="(st, i) in steps" :key="i" class="step in" :style="{ '--d': 700 + i * 250 }">
            <div class="badge"><svg viewBox="0 0 292 292"><use href="#burstFill"/></svg><span>{{ i + 1 }}</span></div>
            <h3>{{ st.title }}</h3>
            <p v-html="st.text"></p>
          </div>
        </div>
        <div class="brand in" style="--d:600"><svg viewBox="0 0 301 72"><use href="#creatorsLogo"/></svg><p>The Influence <em>Operational System</em></p></div>
      </section>

      <!-- DINÂMICA (reaproveitada para cada desafio) -->
      <section class="scene dyn" :class="{ on: scene === 'dyn' }" aria-live="polite">
        <div class="layer" :key="dynKey">
          <div class="eyebrow in" style="--d:0">{{ dyn.eyebrow }}</div>
          <svg class="spark" style="left:474px;top:208px" viewBox="0 0 25 25"><use href="#sparkle"/></svg>
          <h2 class="in" style="--d:120" v-html="dyn.title"></h2>
          <p class="desc in" style="--d:300" :style="{ top: (476 + oy) + 'px' }">{{ dyn.desc }}</p>
          <div class="taglabel in" style="--d:450" :style="{ top: (686 + oy) + 'px' }">{{ dyn.tags.length > 1 ? 'USE AS HASHTAGS' : 'USE A HASHTAG' }}</div>
          <div class="tags in" style="--d:500" :style="{ top: (740 + oy) + 'px' }">
            <span v-for="t in dyn.tags" :key="t" class="chip">{{ t }}</span>
          </div>
          <div class="mini"><svg viewBox="0 0 407 108"><use href="#criaLogo"/></svg><p>Crie, poste e ganhe.</p></div>
          <div class="frames">
            <div v-for="(s, i) in slots" :key="i" class="slot" :class="s.video ? s.state : 'none'">
              <div class="frame">
                <template v-if="s.video">
                  <video :ref="'vid' + i" v-mute :src="srcFor(s.video)" preload="auto" @loadeddata="primeFrame"></video>
                  <div class="prog"><i :style="{ width: s.progress + '%' }"></i></div>
                </template>
                <div v-else class="empty"><strong>O próximo pode ser o seu</strong><span>Pegue uma carta no stand</span></div>
              </div>
              <div class="who"><b>{{ s.video ? (s.video.handle || 'Creator CRIA AÍ') : 'Sua vez!' }}</b></div>
            </div>
          </div>
        </div>
      </section>

      <!-- INTERVALO -->
      <section class="scene" id="break" :class="{ on: scene === 'brk' }" aria-label="Intervalo">
        <video ref="breakVid" v-mute :src="breakSrc" preload="auto"></video>
      </section>

      <!-- PRÊMIO -->
      <section class="scene" id="prize" :class="{ on: scene === 'prize' }" aria-label="Premiação">
        <svg class="burst" style="left:1180px;top:170px;width:820px;height:820px" viewBox="0 0 292 292"><use href="#burstOutline"/></svg>
        <svg class="spark" style="left:1250px;top:300px;width:40px;height:40px" viewBox="0 0 25 25"><use href="#sparkle"/></svg>
        <svg class="spark" style="left:1760px;top:820px;animation-delay:1.1s" viewBox="0 0 25 25"><use href="#sparkle"/></svg>
        <h2 class="in" style="--d:0">TOP 5 DE CADA<br>DESAFIO GANHA</h2>
        <div class="value in" style="--d:250">R$ 500</div>
        <p class="body in" style="--d:500">Pagamento direto pela plataforma, com resultado em até 72h no seu WhatsApp, pelo CRIS.<br>Válido para posts publicados até 23h59 de 29/09.</p>
        <div class="cta in" style="--d:800">Pegue sua carta<br>no stand e participe!</div>
        <div class="brand"><svg viewBox="0 0 301 72"><use href="#creatorsLogo"/></svg><p>The Influence <em>Operational System</em></p></div>
      </section>
    </div>
  </div>

  <div id="notice" v-if="noticeMsg" role="status">{{ noticeMsg }}</div>

  <div id="hud">
    <button class="btn" type="button" @click="toggleFs">Tela cheia</button>
    <button v-if="canUpload" class="btn primary" type="button" @click="openPanel(true)">Gerenciar vídeos</button>
  </div>

  <!-- PAINEL ADMIN -->
  <aside id="admin" :class="{ open: panelOpen }" aria-label="Gerenciar vídeos" :aria-hidden="panelOpen ? 'false' : 'true'">
    <header><h2>Gerenciar vídeos</h2><button class="btn" type="button" @click="openPanel(false)">Fechar</button></header>
    <div class="scroll">
      <div class="card">
        <h3>Adicionar vídeos</h3>
        <label class="l" for="upDyn">Dinâmica</label>
        <select id="upDyn" v-model="upDyn">
          <option v-for="d in all" :key="d.id" :value="d.id">{{ d.name }}</option>
        </select>
        <label class="l" for="upHandle">@ do creator (opcional)</label>
        <input class="field" id="upHandle" type="text" autocomplete="off" v-model="upHandle"
               :disabled="upDyn === 'intervalo'" :placeholder="upDyn === 'intervalo' ? 'Não precisa no intervalo' : '@perfil'">
        <div class="drop" :class="{ over: dragOver }" tabindex="0" role="button"
             @click="$refs.file.click()"
             @keydown.enter.prevent="$refs.file.click()" @keydown.space.prevent="$refs.file.click()"
             @dragover.prevent="dragOver = true" @dragleave="dragOver = false"
             @drop.prevent="dragOver = false; handleFiles($event.dataTransfer.files)">
          Arraste os vídeos aqui ou clique para escolher
        </div>
        <input ref="file" type="file" accept="video/mp4,video/webm,.mp4,.webm" multiple hidden @change="onPick">
        <p class="hint">MP4 ou WebM, até 20 MB cada. Vídeos .MOV do iPhone precisam ser convertidos para MP4 antes. O vídeo entra na fila do player automaticamente, sem recarregar a TV.</p>
        <div class="queue">
          <div v-for="q in queue" :key="q.key" class="q"><span>{{ q.name }}</span><span :class="q.cls">{{ q.status }}</span></div>
        </div>
      </div>

      <div class="card">
        <h3>Vídeos no ar</h3>
        <div class="tabs">
          <button v-for="t in tabList" :key="t.id" type="button" :aria-pressed="t.id === activeTab ? 'true' : 'false'" @click="activeTab = t.id">
            {{ t.name }} ({{ t.count }})
          </button>
        </div>
        <div class="vlist">
          <div v-if="!tabVideos.length" class="empty-list">
            {{ activeTab === 'intervalo'
               ? 'Nenhum vídeo de intervalo. Sem ele, a TV emenda um ciclo no outro.'
               : 'Nenhum vídeo nesta dinâmica ainda. Enquanto isso, a TV mostra o convite para participar.' }}
          </div>
          <div v-for="v in tabVideos" :key="v.id" class="vrow" :class="{ off: v.active === false }">
            <video v-mute preload="metadata" :src="srcFor(v) + '#t=0.5'"></video>
            <div class="meta">

      });
    },

    connect: async function (onVideos, onError) {
      this._cb = onVideos; this._errCb = onError; this._errShown = false;
      // Busca inicial — lança exceção para o catch do init tratar
      var res = await this._fetch("/videos");
      this._cb(res.data.map(this._normalize));
      // Polling — erros transitórios não spammam o toast
      var self = this;
      this._poll = setInterval(function () { self._refresh(); }, 8000);
      return { canUpload: true };
    },

    _refresh: async function () {
      try {
        var res = await this._fetch("/videos");
        this._errShown = false;
        if (this._cb) this._cb(res.data.map(this._normalize));
      } catch (e) {
        if (!this._errShown && this._errCb) {
          this._errShown = true;
          this._errCb(e);
        }
      }
    },

    src: function (v) { return v.source; },

    upload: async function (file, type, meta) {
      var fd = new FormData();
      fd.append("video", file);
      fd.append("dyn", meta.dyn);
      if (meta.handle) fd.append("handle", meta.handle);
      await this._fetch("/videos", {
        method: "POST",
        headers: this._headers(),
        body: fd
      });
      await this._refresh();
    },

    update: async function (id, patch) {
      await this._fetch("/videos/" + id, {
        method: "PATCH",
        headers: this._headers({ "Content-Type": "application/json" }),
        body: JSON.stringify(patch)
      });
      await this._refresh();
    },

    remove: async function (v) {
      await this._fetch("/videos/" + v.id, {
        method: "DELETE",
        headers: this._headers()
      });
      await this._refresh();
    },

    usage: async function () {
      var res = await this._fetch("/usage", { headers: this._headers() });
      return res.data;
    }
  };

  var store = ApiStore;

  /* ======================= DIRETIVA v-mute =======================
     Garante muted/playsinline como propriedade E atributo (autoplay no iOS/TV). */
  Vue.directive("mute", {
    bind: function (el) {
      el.muted = true; el.defaultMuted = true; el.playsInline = true;
      el.setAttribute("muted", ""); el.setAttribute("playsinline", "");
    }
  });

  var emptySlot = function () { return { video: null, state: "none", progress: 0 }; };

  /* ======================= APP ======================= */
  new Vue({
    el: "#app",
    template: "#tpl-app",

    data: function () {
      return {
        steps: STEPS,
        all: ALL,
        scale: 1,
        scene: "",
        bg: "a",
        breaking: false,
        dyn: DYNAMICS[0],
        dynKey: 0,
        slots: [emptySlot(), emptySlot(), emptySlot()],
        breakSrc: "",
        videos: [],
        noticeMsg: "",
        canUpload: true,
        panelOpen: false,
        activeTab: "indica",
        upDyn: "indica",
        upHandle: "",
        dragOver: false,
        queue: [],
        usageText: "",
        armed: {},
        busy: {}
      };
    },

    computed: {
      oy: function () { return this.dyn.title.indexOf("<br>") >= 0 ? 0 : -96; },
      tabList: function () {
        var vids = this.videos;
        return ALL.map(function (d) {
          return { id: d.id, name: d.name, count: vids.filter(function (v) { return v.dyn === d.id; }).length };
        });
      },
      tabVideos: function () {
        var t = this.activeTab;
        return this.videos.filter(function (v) { return v.dyn === t; }).sort(newest);
      }
    },

    watch: {
      videos: function () { this.prune(); },
      upDyn: function (val) { if (val === "intervalo") this.activeTab = "intervalo"; }
    },

    created: function () {
      // estado não-reativo do loop
      this.pageIdx = { indica: 0, cris: 0, loverain: 0 };
      this.curFinish = null;
      this.breakFinish = null;
      this.breakId = null;
      this.idleT = null;
      this.noticeT = null;
    },

    mounted: function () {
      var self = this;
      this.fit();
      window.addEventListener("resize", this.fit);
      ["mousemove", "pointerdown", "keydown", "touchstart"].forEach(function (e) {
        window.addEventListener(e, self.wake, { passive: true });
      });
      window.addEventListener("keydown", function (e) { if (e.key === "Escape") self.openPanel(false); });
      this.wake();
      this.init();
    },

    methods: {
      /* ---------- layout / HUD ---------- */
      fit: function () { this.scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); },
      wake: function () {
        var self = this;
        document.body.classList.remove("idle");
        clearTimeout(this.idleT);
        this.idleT = setTimeout(function () { if (!self.panelOpen) document.body.classList.add("idle"); }, 3000);
      },
      notify: function (msg, ms) {
        var self = this;
        this.noticeMsg = msg;
        clearTimeout(this.noticeT);
        this.noticeT = setTimeout(function () { self.noticeMsg = ""; }, ms || 5000);
      },
      toggleFs: async function () {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (e) { this.notify("O navegador bloqueou a tela cheia aqui. Use F11 (ou Ctrl+Cmd+F no Mac)."); }
      },

      /* ---------- dados ---------- */
      init: async function () {
        var self = this;
        try {
          var res = await store.connect(
            function (list) {
              self.videos = list.filter(function (v) { return ALL.some(function (x) { return x.id === v.dyn; }); });
            },
            function () { self.notify("A conexão com a lista de vídeos caiu. Recarregue a página."); }
          );
          this.canUpload = res.canUpload;
        } catch (e) {
          this.notify("Não foi possível carregar os vídeos. Confira se você está logado.", 10000);
        }
        this.loop();
      },
      srcFor: function (v) { return store.src(v); },
      stillOn: function (id) {
        return !!id && this.videos.some(function (v) { return v.id === id && v.active !== false; });
      },
      byDyn: function (id) {
        return this.videos.filter(function (v) { return v.dyn === id && v.active !== false; }).sort(newest);
      },
      pages: function (id) {
        var list = this.byDyn(id), out = [];
        for (var i = 0; i < list.length; i += 3) out.push(list.slice(i, i + 3));
        return out;
      },

      /* ---------- cenas ---------- */
      show: async function (name, bg) {
        this.scene = "";
        this.bg = bg;
        await this.$nextTick();
        void this.$el.offsetWidth;   // força reflow p/ reiniciar as animações de entrada
        this.scene = name;
        await this.$nextTick();
      },
      vidEl: function (i) { var r = this.$refs["vid" + i]; return Array.isArray(r) ? r[0] : r; },
      primeFrame: function (e) {
        var v = e.target;
        if (v.paused && v.currentTime === 0) { try { v.currentTime = 0.1; } catch (err) {} }
      },

      playSlot: function (i) {
        var self = this;
        return new Promise(function (resolve) {
          var slot = self.slots[i], vid = self.vidEl(i);
          if (!slot.video || !vid) { resolve(); return; }
          var done = false, guard;
          var finish = function () {
            if (done) return; done = true;
            self.curFinish = null; clearTimeout(guard);
            vid.removeEventListener("ended", finish);
            vid.removeEventListener("error", onErr);
            vid.removeEventListener("timeupdate", onTime);
            if (slot.state === "live") slot.state = "done";
            resolve();
          };
          var onErr = function () { setTimeout(finish, 800); };
          // cada vídeo toca no máximo 45 s, seja qual for a duração real
          var onTime = function () {
            var len = Math.min(vid.duration || CLIP_S, CLIP_S);
            slot.progress = Math.min(vid.currentTime / len * 100, 100);
            if (vid.currentTime >= CLIP_S) { vid.pause(); finish(); }
          };
          guard = setTimeout(finish, MAX_VIDEO_MS);
          vid.addEventListener("ended", finish);
          vid.addEventListener("error", onErr);
          vid.addEventListener("timeupdate", onTime);
          slot.state = "live";
          self.curFinish = finish;
          try { vid.currentTime = 0; } catch (e) {}
          var p = vid.play();
          if (p && p.catch) p.catch(function () { setTimeout(finish, 1500); });
        });
      },

      /* vídeos ocultados/excluídos saem da TV na hora, mesmo no meio do slide */
      prune: function () {
        var self = this;
        this.slots.forEach(function (s, i) {
          if (!s.video || self.stillOn(s.video.id)) return;
          if (s.state === "live" && self.curFinish) self.curFinish();
          var vid = self.vidEl(i);
          if (vid) { vid.pause(); vid.removeAttribute("src"); vid.load(); }
          s.video = null; s.state = "none"; s.progress = 0;
        });
        if (this.breakFinish && this.breakId && !this.stillOn(this.breakId)) this.breakFinish();
      },

      runDyn: async function (d) {
        var pg = this.pages(d.id), group = [];
        if (pg.length) {
          var i = this.pageIdx[d.id] % pg.length;
          this.pageIdx[d.id] = i + 1;
          group = pg[i];
        }
        this.dyn = d;
        this.slots = [0, 1, 2].map(function (k) {
          return group[k] ? { video: group[k], state: "wait", progress: 0 } : emptySlot();
        });
        this.dynKey++;
        await this.show("dyn", d.bg);
        if (!group.length) { await wait(EMPTY_MS); return; }
        await wait(1400);   // deixa a entrada assentar
        for (var k = 0; k < 3; k++) {
          var s = this.slots[k];
          if (s.video && this.stillOn(s.video.id)) await this.playSlot(k);
        }
        await wait(900);
      },

      /* ---------- intervalo ---------- */
      latestBreak: function () {
        return this.videos.filter(function (v) { return v.dyn === "intervalo" && v.active !== false; }).sort(newest)[0] || null;
      },
      prepBreak: function () {
        var b = this.latestBreak();
        if (!b) return null;
        this.breakSrc = this.srcFor(b);   // Vue só troca o src se mudou
        return b;
      },
      runBreak: async function () {
        var self = this, bk = this.prepBreak();
        if (!bk) return;
        this.breakId = bk.id;
        await this.show("brk", "c");
        this.breaking = true;
        await wait(700);
        var bv = this.$refs.breakVid;
        await new Promise(function (resolve) {
          var done = false, guard;
          var fin = function () {
            if (done) return; done = true;
            self.breakFinish = null; self.breakId = null;
            clearTimeout(guard); bv.onended = bv.onerror = null;
            resolve();
          };
          guard = setTimeout(fin, MAX_BREAK_MS);
          self.breakFinish = fin;
          bv.onended = fin;
          bv.onerror = function () { setTimeout(fin, 800); };
          try { bv.currentTime = 0; } catch (e) {}
          var p = bv.play();
          if (p && p.catch) p.catch(function () { setTimeout(fin, 1500); });
        });
        this.breaking = false;
        bv.pause();
      },

      loop: async function () {
        var self = this;
        for (;;) {
          await this.show("intro", "a"); await wait(INFO_MS);
          for (var i = 0; i < DYNAMICS.length; i++) await this.runDyn(DYNAMICS[i]);
          this.prepBreak();                               // começa a bufferizar o intervalo durante o prêmio
          await this.show("prize", "c"); await wait(INFO_MS);
          for (var j = 0; j < DYNAMICS.length; j++) {     // rodada extra quando há mais vídeos
            if (self.pages(DYNAMICS[j].id).length > 1) await this.runDyn(DYNAMICS[j]);
          }
          await this.runBreak();                          // intervalo entre um ciclo e outro
        }
      },

      /* ---------- painel ---------- */
      openPanel: function (open) {
        this.panelOpen = open;
        if (open) this.refreshUsage();
        this.wake();
      },
      onPick: function (e) { this.handleFiles(e.target.files); e.target.value = ""; },

      handleFiles: async function (list) {
        if (!this.canUpload) { this.notify("Sem permissão para enviar vídeos nesta conta."); return; }
        var dyn = this.upDyn, handle = dyn === "intervalo" ? "" : cleanHandle(this.upHandle);
        var files = Array.prototype.slice.call(list);
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          var q = { key: Date.now() + "-" + i + "-" + Math.random(), name: f.name, status: "Enviando…", cls: "" };
          this.queue.unshift(q);
          var type = f.type;
          if (!type || type === "video/quicktime") {
            if (/\.mp4$/i.test(f.name)) type = "video/mp4";
            else if (/\.webm$/i.test(f.name)) type = "video/webm";
          }
          if (type !== "video/mp4" && type !== "video/webm") { q.status = "Formato não aceito (use MP4)"; q.cls = "err"; continue; }
          if (f.size > MAX_BYTES) { q.status = "Acima de 20 MB"; q.cls = "err"; continue; }
          try {
            await store.upload(f, type, { dyn: dyn, handle: handle, createdAt: Date.now(), active: true });
            q.status = "No ar ✓"; q.cls = "ok";
          } catch (e) {
            q.status = ERR[e && e.code] || "Falhou. Tente de novo."; q.cls = "err";
          }
        }
        this.refreshUsage();
      },

      rowStatus: function (v) {
        if (v.active === false) return "Oculto na TV";
        var live = this.tabVideos.filter(function (x) { return x.active !== false; });
        var gi = live.indexOf(v);
        if (v.dyn === "intervalo") return gi === 0 ? "Tocando no intervalo" : "Reserva";
        return "Na TV · grupo " + (Math.floor(gi / 3) + 1);
      },
      saveHandle: async function (v, e) {
        try { await store.update(v.id, { handle: cleanHandle(e.target.value) }); this.notify("@ atualizado.", 2500); }
        catch (err) { this.notify("Não foi possível salvar o @."); }
      },
      toggleActive: async function (v) {
        var show = v.active === false;
        this.$set(this.busy, v.id, "toggle");
        try {
          await store.update(v.id, { active: show });
          this.notify(show ? "Vídeo de volta na TV." : "Vídeo oculto e retirado da TV.", 3000);
        } catch (e) { this.notify("Não foi possível atualizar. Confira se sua conta pode editar."); }
        this.$delete(this.busy, v.id);
      },
      del: async function (v) {
        var self = this;
        if (!this.armed[v.id]) {
          this.$set(this.armed, v.id, true);
          setTimeout(function () { self.$delete(self.armed, v.id); }, 4000);
          return;
        }
        this.$set(this.busy, v.id, "del");
        try {
          await store.remove(v);
          this.refreshUsage();
          this.notify("Vídeo excluído e retirado da TV.", 3000);
        } catch (e) {
          this.notify("Não foi possível excluir. Confira se sua conta pode editar.");
        }
        this.$delete(this.busy, v.id);
        this.$delete(this.armed, v.id);
      },
      refreshUsage: async function () {
        if (!this.canUpload) return;
        try {
          var u = await store.usage();
          if (!u) return;
          var mb = function (b) { return (b / 1048576).toFixed(0); };
          this.usageText = u.maxBytes
            ? "Espaço usado: " + mb(u.bytes) + " MB de " + mb(u.maxBytes) + " MB · " + u.files + " de " + u.maxFiles + " arquivos."
            : "Espaço usado: " + mb(u.bytes) + " MB · " + u.files + " arquivos.";
        } catch (e) {}
      }
    }
  });
})();
</script>
</body>
</html>
